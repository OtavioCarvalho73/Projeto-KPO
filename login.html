<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPO - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-card">
        <div class="card border-0 shadow-lg p-4">
            <div class="text-center mb-4">
                <h1 class="logo-text mb-0">KPO</h1>
                <p class="text-muted small">Zeladoria Urbana Monte Alto</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="nome@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold">Senha</label>
                    <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="lembrar">
                    <label class="form-check-label small" for="lembrar">Lembrar de mim</label>
                </div>

                <form id="loginForm">
                    <button type="submit" class="btn btn-kpo w-100 py-2 fw-bold mb-3">ENTRAR</button>
                </form>

                <script>
                    document.getElementById('loginForm').addEventListener('submit', function (e) {
                        e.preventDefault();
                        window.location.href = 'home.html';
                    });
                </script>

                <div class="text-center">
                    <a href="forgot-password.html" class="text-decoration-none small">Esqueceu a senha?</a>
                    <hr>
                    <p class="mb-0 small text-muted">Não tem uma conta?</p>
                    <a href="signin.html" class="text-primary fw-bold text-decoration-none">Cadastre-se para relatar</a>
                </div>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="index.html" class="btn btn-link text-muted text-decoration-none btn-sm">
                ← Voltar ao início
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
