<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - KPO Zeladoria Urbana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-kpo shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">KPO | Zeladoria Urbana</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 d-none d-sm-inline small">Olá, Cidadão</span>
                <button class="btn btn-outline-light btn-sm" onclick="location.href='index.html'">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold" style="color: var(--primary-blue);">Minha Conta</h2>
                <p class="text-muted">Atualize seus dados de contato e preferências de notificação.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card profile-card text-center p-4">
                    <div class="profile-icon-wrapper">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <h5 class="fw-bold mb-1">Cidadão Monte Altense</h5>
                    <p class="text-muted small mb-3">Membro desde 2023</p>
                    <hr>
                    <div class="text-start mt-3">
                        <p class="mb-2"><i class="bi bi-envelope me-2 text-primary"></i> cidadao@email.com</p>
                        <p class="mb-0"><i class="bi bi-telephone me-2 text-primary"></i> (16) 99999-9999</p>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card profile-card p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Informações Pessoais</h5>
                    
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nomeInput" class="form-label fw-semibold">Nome Completo</label>
                                <input type="text" class="form-control bg-light" id="nomeInput" value="Cidadão Monte Altense">
                            </div>
                            <div class="col-md-6">
                                <label for="cpfInput" class="form-label fw-semibold">CPF</label>
                                <input type="text" class="form-control bg-gray" id="cpfInput" value="123.456.789-00" disabled>
                                <div class="form-text">O CPF não pode ser alterado.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="emailInput" class="form-label fw-semibold">E-mail</label>
                                <input type="email" class="form-control bg-light" id="emailInput" value="cidadao@email.com">
                            </div>
                            <div class="col-md-6">
                                <label for="telefoneInput" class="form-label fw-semibold">Telefone / WhatsApp</label>
                                <input type="tel" class="form-control bg-light" id="telefoneInput" value="(16) 99999-9999">
                            </div>
                            
                            <h5 class="fw-bold mt-5 mb-3 border-bottom pb-2">Preferências</h5>
                            
                            <div class="col-12 mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="notificacaoEmail" checked>
                                    <label class="form-check-label" for="notificacaoEmail">Receber atualizações dos meus relatos por E-mail</label>
                                </div>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="notificacaoSms">
                                    <label class="form-check-label" for="notificacaoSms">Receber alertas importantes por SMS</label>
                                </div>
                            </div>

                            <div class="col-12 mt-4 text-end" onclick="location.href='home.html'">
                                <button type="button" class="btn btn-light me-2">Cancelar</button>
                                <button type="submit" class="btn btn-kpo px-4" onclick="location.href='home.html'">Salvar Alterações</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
