<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPO - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="recovery-card">
        <div class="card border-0 shadow-lg p-4">
            <div class="text-center mb-4">
                <h1 class="text-primary fw-bold h2 mb-0">KPO</h1>
                <p class="text-muted small">Recuperação de Acesso</p>
            </div>

            <form id="recoveryForm">
                <p class="text-muted small text-center mb-4">Insira seu e-mail para receber o link de redefinição.</p>
                <div class="mb-4">
                    <input type="email" class="form-control" placeholder="nome@email.com" required>
                </div>
                <button type="submit" class="btn btn-kpo w-100 fw-bold">ENVIAR LINK</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none small fw-bold">Voltar para o Login</a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="recoveryModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-5">
                    <h3 class="fw-bold">E-mail Enviado!</h3>
                    <p class="text-muted">Verifique sua caixa de entrada para prosseguir.</p>
                    <button type="button" class="btn btn-kpo px-5" onclick="location.href='login.html'">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            new bootstrap.Modal(document.getElementById('recoveryModal')).show();
        });
    </script>
</body>
</html>
