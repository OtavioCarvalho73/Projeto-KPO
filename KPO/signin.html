<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPO - Criar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signin-card">
        <div class="card border-0 shadow-lg p-4">
            <div class="text-center mb-4">
                <h1 class="logo-text h2 mb-0">KPO</h1>
                <p class="text-muted small">Cadastro de Cidadão - Monte Alto</p>
            </div>

            <form id="signinForm">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Senha</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Confirmar Senha</label>
                        <input type="password" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-kpo w-100 py-2 fw-bold mb-3">
                    CRIAR MINHA CONTA
                </button>

                <div class="text-center">
                    <p class="mb-0 small text-muted">Já possui uma conta? <a href="login.html" class="text-primary fw-bold text-decoration-none">Fazer Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-5">
                    <div class="mb-3">
                        <i class="text-success display-1">✔</i>
                    </div>
                    <h3 class="fw-bold">Conta Criada!</h3>
                    <p class="text-muted">Seu cadastro no projeto KPO foi realizado com sucesso.</p>
                    <button type="button" class="btn btn-kpo px-5 fw-bold" id="btnRedirect">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('signinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const myModal = new bootstrap.Modal(document.getElementById('successModal'));
            myModal.show();
        });

        document.getElementById('btnRedirect').addEventListener('click', function() {
            window.location.href = 'login.html'; 
        });
    </script>
</body>
</html>
