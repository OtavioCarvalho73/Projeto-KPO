<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPO - Meus Relatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <main>
        <nav class="navbar navbar-dark bg-kpo shadow-sm sticky-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="home.html">
                    <span class="material-icons me-2">arrow_back</span>
                    <span class="fw-bold">Meus Relatos</span>
                </a>
                <button class="btn btn-outline-light btn-sm rounded-pill" onclick="location.reload()">
                    <span class="material-icons style='font-size:18px; vertical-align:middle;'">refresh</span>
                </button>
            </div>
        </nav>

        <div class="container my-4">
            <div class="row g-2 mb-4 text-center">
                <div class="col">
                    <div class="bg-white p-2 rounded-3 shadow-sm border-bottom border-warning border-4">
                        <small class="text-muted d-block">Abertos</small>
                        <span class="fw-bold h5">01</span>
                    </div>
                </div>
                <div class="col">
                    <div class="bg-white p-2 rounded-3 shadow-sm border-bottom border-primary border-4">
                        <small class="text-muted d-block">Em Curso</small>
                        <span class="fw-bold h5">00</span>
                    </div>
                </div>
                <div class="col">
                    <div class="bg-white p-2 rounded-3 shadow-sm border-bottom border-success border-4">
                        <small class="text-muted d-block">Resolvidos</small>
                        <span class="fw-bold h5">00</span>
                    </div>
                </div>
            </div>

            <div id="listaRelatos">
                <div class="card card-relato border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <span class="text-muted small">Protocolo: #2026001</span>
                                <h6 class="fw-bold mb-0">Iluminação Pública</h6>
                            </div>
                            <span class="badge badge-status status-aberto">Aberto</span>
                        </div>
                        <p class="text-secondary small mb-3">Lâmpada queimada.</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center text-muted small">
                                <span class="material-icons me-1" style="font-size: 16px;">calendar_today</span>
                                18 Mai, 2026
                            </div>
                            <a href="detalhes.html" class="btn btn-sm btn-outline-primary rounded-pill">Ver Detalhes</a>
                        </div>
                    </div>
                </div>

                <div class="text-center py-5 d-none">
                    <span class="material-icons text-muted" style="font-size: 64px;">history_edu</span>
                    <p class="text-muted mt-2">Você ainda não possui relatos registrados.</p>
                    <a href="relatar.html" class="btn btn-kpo rounded-pill px-4">Criar Novo Relato</a>
                </div>
            </div>
        </div>

        <a href="relatar.html"
            class="btn btn-kpo shadow-lg position-fixed bottom-0 end-0 m-4 rounded-circle d-flex align-items-center justify-content-center"
            style="width: 56px; height: 56px; z-index: 1000;">
            <span class="material-icons">add</span>
        </a>
    </main>
    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
